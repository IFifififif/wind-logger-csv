[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-logger-csv"
version = "0.1.0"
description = "Log current wind speed to local CSV from Open-Meteo"
authors = [{name = "<your-name>", email = "<your-email>"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
wind-csv = "wind_logger_csv.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
