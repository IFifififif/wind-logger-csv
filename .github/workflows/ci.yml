name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Smoke test
        run: |
          python - <<'PY'
import os
os.environ['PLACE_NAME'] = '上海'
from wind_logger_csv.cli import cmd_once
class A: pass
cmd_once(A())
print('ok')
PY
